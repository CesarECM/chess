name: EAS Build or Update

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: chess-app/package-lock.json

      - name: Install dependencies
        working-directory: chess-app
        run: npm install --legacy-peer-deps

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # Detect whether this push touches native files.
      # Native = anything under android/, ios/, plugins/, app.json,
      #          package.json (dep changes), or eas.json.
      - name: Detect native changes
        id: native_check
        run: |
          git fetch origin ${{ github.event.before }} --depth=1 2>/dev/null || true
          CHANGED=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} 2>/dev/null || git diff --name-only HEAD~1 HEAD)
          echo "Changed files:"
          echo "$CHANGED"
          if echo "$CHANGED" | grep -qE '^chess-app/(android|ios|plugins|app\.json|app\.config\.(js|ts)|package\.json|eas\.json)'; then
            echo "is_native=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_native=false" >> "$GITHUB_OUTPUT"
          fi

      # Path A — native change: trigger a new EAS build for both platforms.
      # The build goes to App Store / Play Store review from there.
      - name: EAS Build (native change detected)
        if: steps.native_check.outputs.is_native == 'true'
        working-directory: chess-app
        run: eas build --platform all --profile production --non-interactive

      # Path B — JS-only change: push an OTA update to the production channel.
      # Uses the same runtimeVersion policy as the current live binaries.
      - name: EAS Update (JS-only change)
        if: steps.native_check.outputs.is_native == 'false'
        working-directory: chess-app
        run: |
          eas update \
            --channel production \
            --message "${{ github.event.head_commit.message }}" \
            --non-interactive
